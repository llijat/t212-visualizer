<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sectors · T212 Visualizer</title>
    <link rel="stylesheet" th:href="@{/css/common.css}" href="/css/common.css">
    <script>try { if (localStorage.getItem('t212-privacy') === 'on') document.documentElement.classList.add('privacy'); } catch (e) { }</script>
    <style>
        /* ===== Colour of a move: deep, quiet tones. The strongest gain is a forest green, the strongest loss a wine red,
           and in between they fade into the card's blue grey. White text keeps 6:1 or more on every tile ===== */
        :root {
            --up-max: #186345;
            --down-max: #8a2c37;
            --flat: #222b38;
            --held-ring: color-mix(in srgb, var(--accent) 55%, transparent);   /* where you hold stocks: present, not loud */
        }

        /* ===== Page: the map on the left, the column beside it ===== */
        .sectors-page {
            flex: 1;
            min-height: 0;
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(19rem, 22rem);
            gap: 1.25rem;
            padding: 1.1rem 2rem 1.4rem;
        }
        .map-area { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 0.7rem; }

        .sectors-head { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem 1.25rem; }
        .sectors-head h1 { margin: 0; font: 500 var(--fs-xl) var(--figures); letter-spacing: 0.01em; }
        .sectors-head h1 time { margin-left: 0.5rem; color: var(--muted); font: 400 var(--fs-md) var(--text-font); }
        .sectors-tools { margin-left: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; }
        .segmented button { font-size: var(--fs-xs); }
        .waiting { margin: 0; color: var(--muted); font-size: var(--fs-xs); }

        /* ===== The strip: every subsector from the worst to the best. It is also the colour key ===== */
        .strip-wrap { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 0.75rem; color: var(--faint); font: var(--fs-2xs) var(--figures); font-variant-numeric: tabular-nums; white-space: nowrap; }
        .strip { display: flex; gap: 2px; height: 0.75rem; }
        .strip span { flex: 1; position: relative; border-radius: 2px; background: var(--flat); }
        .strip span.held::after { content: ""; position: absolute; left: 50%; top: calc(100% + 3px); width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--held-ring); }

        /* ===== The map: each tile is placed by the script; its size is the data ===== */
        .treemap { position: relative; flex: 1; min-height: 18rem; margin-top: 0.3rem; }
        .sector-block { position: absolute; }
        .sector-label {
            position: absolute;
            inset: 0 0 auto 0;
            height: 1.4rem;
            display: flex;
            align-items: baseline;
            gap: 0.45rem;
            padding: 0 0.1rem;
            white-space: nowrap;
            font: 500 var(--fs-sm) var(--figures);
            letter-spacing: 0.01em;
        }
        .sector-label.two { height: 2.3rem; flex-direction: column; gap: 0; line-height: 1.15; }
        .sector-label .move { flex: none; font-size: var(--fs-xs); font-variant-numeric: tabular-nums; }

        .tile {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding: 0.4rem 0.5rem;
            border: 0;
            border-radius: var(--radius-xs);
            background: var(--tile-bg, var(--flat));
            color: var(--text);
            text-align: left;
            font: inherit;
            overflow: hidden;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .tile:hover { filter: brightness(1.2); }
        .tile:focus-visible { outline: 2px solid var(--text); outline-offset: -2px; z-index: 1; }
        .tile.held { box-shadow: inset 0 0 0 1.5px var(--held-ring); }
        .tile[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--text); z-index: 1; }
        .tile-name { flex: none; max-width: 100%; overflow: hidden; white-space: nowrap; font-size: var(--fs-xs); line-height: 1.2; }
        .tile-name.wrap { white-space: normal; }
        .tile-move { flex: none; margin-top: 0.15rem; white-space: nowrap; font: 500 var(--size, 1.1rem)/1.05 var(--figures); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
        .tile-etf { position: absolute; right: 0.5rem; bottom: 0.35rem; font: 500 var(--fs-2xs) var(--figures); letter-spacing: 0.04em; }
        .tile-chips { margin-top: auto; display: flex; flex-wrap: wrap; gap: 0.2rem; max-width: calc(100% - 2.5rem); }
        .tile-chip { padding: 0 0.3rem; border-radius: var(--radius-xs); background: rgb(0 0 0 / 0.3); font: 500 var(--fs-2xs)/1.55 var(--figures); letter-spacing: 0.02em; }
        .tile.compact { padding: 0.2rem 0.3rem; justify-content: center; align-items: center; }
        .tile.compact .tile-move { margin: 0; }
        /* Tall and narrow: the text turns and reads from bottom to top */
        .tile.vertical { writing-mode: vertical-rl; transform: rotate(180deg); flex-direction: row; padding: 0.4rem 0.2rem; align-items: center; gap: 0.35rem; }   /* row runs along the text: name and % one after the other */
        .tile.vertical .tile-name, .tile.vertical .tile-move { margin: 0; font-size: var(--fs-xs); }
        /* "My holdings": what you do not hold almost disappears, so what does affect you stands out */
        .treemap.only-mine .tile:not(.held) { opacity: 0.16; }
        .treemap.only-mine .tile:not(.held):hover, .treemap.only-mine .tile:not(.held):focus-visible { opacity: 0.6; }

        .map-empty { position: absolute; inset: 0; display: grid; place-content: center; gap: 0.35rem; text-align: center; color: var(--muted); }
        .map-empty strong { color: var(--text); font: 500 var(--fs-lg) var(--figures); }

        /* ===== Tooltip: follows the pointer ===== */
        .tip {
            position: fixed;
            z-index: 20;
            width: max-content;
            max-width: 16rem;
            padding: 0.55rem 0.7rem;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            background: var(--raised);
            box-shadow: 0 8px 24px rgb(0 0 0 / 0.4);
            pointer-events: none;
            font-size: var(--fs-xs);
        }
        .tip-name { font: 500 var(--fs-sm) var(--figures); }
        .tip-where { color: var(--muted); }
        .tip-line { margin-top: 0.35rem; display: flex; justify-content: space-between; gap: 1rem; font-variant-numeric: tabular-nums; }
        .tip-line span:first-child { color: var(--muted); }

        /* ===== Column ===== */
        .pulse { min-height: 0; display: flex; flex-direction: column; background: var(--panel); border-radius: var(--radius); padding: 1.25rem 1.35rem; }
        .pulse-body { flex: 1; min-height: 0; overflow-y: auto; margin: 0 -0.5rem; padding: 0 0.5rem; }
        .pulse h2 { margin: 0 0 1rem; }
        .pulse h3 { margin: 1.5rem 0 0.65rem; color: var(--muted); font: 500 var(--fs-sm) var(--text-font); }
        .pulse-empty { margin: 0; color: var(--muted); font-size: var(--fs-sm); }
        .pulse-note { margin: 1.25rem 0 0; color: var(--faint); font-size: var(--fs-2xs); }

        /* You and the market: two figures, and both as marks on one line from losing to gaining */
        .versus-figures { display: flex; align-items: flex-end; gap: 1.5rem; }
        .versus-figures > div { display: flex; flex-direction: column; gap: 0.15rem; }
        .versus-figures b { font: 500 1.9rem/1 var(--figures); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
        .versus-figures .market b { font-size: var(--fs-xl); color: var(--muted); }
        .versus-figures small { display: inline-flex; align-items: center; gap: 0.4rem; color: var(--muted); font-size: var(--fs-xs); }
        .mark-you, .mark-market { flex: none; width: 0.6rem; height: 0.6rem; border-radius: 50%; }
        .mark-you { background: var(--accent); }
        .mark-market { box-shadow: inset 0 0 0 2px var(--muted); }
        .versus-line { position: relative; height: 1.1rem; margin: 1rem 0.3rem 0; }
        .versus-line::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 2px; margin-top: -1px; border-radius: 1px;
                               background: linear-gradient(90deg, color-mix(in srgb, var(--red) 55%, transparent), var(--border) 50%, color-mix(in srgb, var(--green) 55%, transparent)); }
        .versus-line .zero { position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: var(--faint); }
        .versus-line .mark-you, .versus-line .mark-market { position: absolute; top: 50%; width: 0.75rem; height: 0.75rem; margin: -0.375rem 0 0 -0.375rem; }
        .versus-line .mark-you { box-shadow: 0 0 0 3px var(--panel); }
        .versus-line .mark-market { background: var(--panel); }
        .versus-scale { display: flex; justify-content: space-between; margin: 0.3rem 0 0; color: var(--faint); font: var(--fs-2xs) var(--figures); font-variant-numeric: tabular-nums; }
        .versus-note { margin: 0.75rem 0 0; color: var(--muted); font-size: var(--fs-xs); }

        /* Where you hold stocks: bars around zero, so the day reads in one look */
        .bars { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.1rem; }
        .bars button {
            width: calc(100% + 1rem);
            display: grid;
            grid-template-columns: 7.5rem 1fr 3.6rem;
            align-items: center;
            gap: 0.6rem;
            margin: 0 -0.5rem;
            padding: 0.3rem 0.5rem;
            border: 0;
            border-radius: var(--radius-sm);
            background: none;
            color: var(--text);
            font: inherit;
            font-size: var(--fs-xs);
            text-align: left;
            cursor: pointer;
        }
        .bars button:hover { background: var(--raised); }
        .bars button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
        .bars .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .bars .track { position: relative; height: 0.8rem; }
        .bars .track::before { content: ""; position: absolute; left: 50%; top: -0.2rem; bottom: -0.2rem; width: 1px; background: var(--border); }
        .bars .fill { position: absolute; top: 0; bottom: 0; border-radius: 2px; }
        .bars .fill.up { background: var(--green); }
        .bars .fill.down { background: var(--red); }
        .bars .value { text-align: right; font: 500 var(--fs-xs) var(--figures); font-variant-numeric: tabular-nums; }

        .weight-bar { display: flex; gap: 2px; height: 0.6rem; border-radius: var(--radius-xs); overflow: hidden; background: var(--raised); }
        .weight-bar span { background: var(--swatch); }
        .weight-list { list-style: none; margin: 0.75rem 0 0; padding: 0; display: grid; gap: 0.25rem; }
        .weight-list li { display: grid; grid-template-columns: 0.6rem 1fr auto auto; align-items: center; gap: 0.55rem; font-size: var(--fs-sm); }
        .weight-list .swatch { width: 0.6rem; height: 0.6rem; border-radius: var(--radius-xs); background: var(--swatch); }
        .weight-list .figure { font: 500 var(--fs-sm) var(--figures); font-variant-numeric: tabular-nums; }
        .weight-list .day { min-width: 3.4rem; text-align: right; font: var(--fs-xs) var(--figures); font-variant-numeric: tabular-nums; }
        .weight-more { margin: 0.35rem 0 0; color: var(--faint); font-size: var(--fs-xs); }

        /* The subsector you picked */
        .back {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            height: var(--control-h-sm);
            margin: -0.25rem 0 0.75rem -0.4rem;
            padding: 0 0.4rem;
            border: 0;
            border-radius: var(--radius-sm);
            background: none;
            color: var(--accent);
            font: 500 var(--fs-xs) var(--text-font);
            cursor: pointer;
        }
        .back:hover { background: var(--accent-bg); }
        .back:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
        .pulse .detail-title { margin-bottom: 0; }
        .detail-where { margin: 0.15rem 0 0; color: var(--muted); font-size: var(--fs-xs); }
        .detail-move { margin: 1rem 0 0; font: 500 2.4rem/1 var(--figures); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
        .detail-move small { margin-left: 0.4rem; color: var(--muted); font: 400 var(--fs-sm) var(--text-font); letter-spacing: 0; }
        .detail-exposure { margin: 1.25rem 0 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.75rem; }
        .detail-exposure dt { color: var(--muted); font-size: var(--fs-xs); }
        .detail-exposure dd { margin: 0.1rem 0 0; font: 500 var(--fs-md) var(--figures); font-variant-numeric: tabular-nums; }
        .stocks { list-style: none; margin: 0; padding: 0; }
        .stocks a { display: grid; grid-template-columns: auto 1fr auto; align-items: center; column-gap: 0.65rem; margin: 0 -0.5rem; padding: 0.45rem 0.5rem; border-radius: var(--radius-sm); color: var(--text); text-decoration: none; }
        .stocks a:hover { background: var(--raised); }
        .stocks a:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
        .stocks .logo { grid-row: 1 / span 2; font-size: 1.5rem; }
        .stocks .symbol { font: 500 var(--fs-sm) var(--figures); }
        .stocks .name { grid-column: 2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--faint); font-size: var(--fs-2xs); }
        .stocks .figures-right { grid-row: 1 / span 2; grid-column: 3; text-align: right; font: 500 var(--fs-sm) var(--figures); font-variant-numeric: tabular-nums; }
        .stocks .figures-right small { display: block; color: var(--faint); font-size: var(--fs-2xs); font-weight: 400; }

        .up { color: var(--green); }
        .down { color: var(--red); }
        .flat { color: var(--muted); }

        @media (max-width: 1100px) {
            .sectors-page { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto; padding: 1rem; overflow-y: auto; }
            .map-area, .pulse { min-height: auto; }   /* stacked, each takes the height of what it holds and the page scrolls */
            .treemap { flex: none; height: 62vh; min-height: 22rem; }
            .pulse-body { overflow: visible; }
        }
        @media (max-width: 640px) {
            .sectors-head h1 time { display: block; margin: 0.15rem 0 0; }
            .sectors-tools { margin-left: 0; }
        }
        @media (prefers-reduced-motion: reduce) {
            .tile { transition: none; }
        }
    </style>
</head>
<body>

    <header class="topbar">
        <th:block th:replace="~{fragments/topbar :: bar('sectors')}"></th:block>
    </header>

    <main class="sectors-page">
        <section class="map-area" aria-labelledby="sectors-title">
            <div class="sectors-head">
                <h1 id="sectors-title">Sectors <time id="today" th:datetime="${today}" th:text="${today}">2026-11-20</time></h1>
                <div class="sectors-tools">
                    <div class="segmented" role="group" aria-label="Tile size">
                        <button type="button" data-mode="market" aria-pressed="true" title="Tile size: how much each subsector weighs in the S&amp;P 500">Market</button>
                        <button type="button" data-mode="mine" aria-pressed="false" title="Tile size: how much of your money is in each subsector">My exposure</button>
                    </div>
                    <div class="segmented" role="group" aria-label="Period">
                        <button type="button" aria-pressed="true">1D</button>
                        <button type="button" disabled title="Comes when there are enough saved prices">1W</button>
                        <button type="button" disabled title="Comes when there are enough saved prices">1M</button>
                        <button type="button" disabled title="Comes when there are enough saved prices">YTD</button>
                    </div>
                    <button type="button" class="filter-chip" id="only-mine" aria-pressed="false" title="Fade the subsectors where you hold nothing">My holdings</button>
                </div>
            </div>
            <p class="waiting" id="waiting" hidden>The sector prices arrive a few minutes after the app starts, and every 15 minutes after that.</p>

            <div class="strip-wrap" id="strip-wrap" hidden>
                <span id="strip-worst"></span>
                <div class="strip" id="strip" role="img"></div>
                <span id="strip-best"></span>
            </div>

            <div class="treemap" id="treemap" role="group" aria-label="Sectors and subsectors, sized by weight and coloured by today's move"></div>
        </section>

        <aside class="pulse" aria-labelledby="pulse-title">
            <div class="pulse-body scroll-hints" id="pulse"></div>
        </aside>
    </main>

    <div class="tip" id="tip" role="tooltip" hidden></div>

    <script th:inline="javascript">
        const SECTOR_MAP = /*[[${sectorMap}]]*/ { sectors: [], invested: 0 };
    </script>
    <script>
        (function () {
            const data = SECTOR_MAP;
            const map = document.getElementById('treemap');
            const pulse = document.getElementById('pulse');
            const tip = document.getElementById('tip');
            const modeButtons = [...document.querySelectorAll('[data-mode]')];
            const onlyMineButton = document.getElementById('only-mine');
            const stored = {
                get(key) { try { return localStorage.getItem(key); } catch (e) { return null; } },
                set(key, value) { try { localStorage.setItem(key, value); } catch (e) { /* private window: nothing remembered */ } }
            };
            const euros = new Intl.NumberFormat('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            const MAX_MOVE = 3;   // ± 3 % is already a big day for a whole subsector: the colour stops growing there

            // Shorter names, for the tiles and labels where the full one does not fit (the full one stays in the tooltip)
            const SHORT = {
                'Consumer discretionary': 'Discretionary', 'Communication services': 'Communication', 'Consumer staples': 'Staples',
                'Semiconductors': 'Semis', 'Hardware & devices': 'Hardware', 'Cybersecurity': 'Cyber', 'Capital markets': 'Markets',
                'Automobiles': 'Autos', 'Travel & leisure': 'Travel', 'Homebuilders': 'Homes', 'Internet & media': 'Internet',
                'Medical devices': 'Devices', 'Health care providers': 'Providers', 'Machinery & services': 'Machinery',
                'Aerospace & defense': 'Defense', 'Transportation': 'Transport', 'Food & beverage': 'Food',
                'Household & staples retail': 'Household', 'Exploration & production': 'E&P', 'Oil services': 'Services',
                'Clean energy': 'Clean', 'Chemicals & materials': 'Chemicals', 'Metals & mining': 'Mining', 'Gold miners': 'Gold'
            };
            const shortName = name => SHORT[name] || name;

            // The date in words, in English like the rest of the app
            const today = document.getElementById('today');
            const day = new Date(today.getAttribute('datetime') + 'T12:00:00Z');
            if (!Number.isNaN(day.getTime())) {
                today.textContent = day.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' });
            }

            // ===== Small helpers =====
            const num = value => value == null ? null : Number(value);
            const signed = (value, digits = 2) => (value < 0 ? '−' : '+') + Math.abs(value).toFixed(digits) + ' %';
            const moveText = value => value == null ? '—' : signed(value);
            const moveClass = value => value == null || value === 0 ? 'flat' : value > 0 ? 'up' : 'down';
            const money = value => '<span class="money">' + euros.format(value) + ' €</span>';
            const signedMoney = value => '<span class="money">' + (value < 0 ? '−' : '+') + euros.format(Math.abs(value)) + ' €</span>';
            const escape = text => String(text ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
            const percent = value => (num(value) ?? 0).toFixed(1) + ' %';
            const colour = move => move == null ? ''
                : 'color-mix(in oklab, var(' + (move < 0 ? '--down-max' : '--up-max') + ') ' + Math.round(Math.min(Math.abs(move), MAX_MOVE) / MAX_MOVE * 100) + '%, var(--flat))';

            // Every subsector knows its sector, for the column and the tooltip
            data.sectors.forEach(sector => sector.subsectors.forEach(sub => { sub.sector = sector.name; }));
            const subsectors = data.sectors.flatMap(sector => sector.subsectors);
            const quoted = subsectors.filter(sub => sub.changePercent != null);
            document.getElementById('waiting').hidden = quoted.length > 0;

            // An average of the moves, weighted by market or by your money
            function averageMove(list, weightOf) {
                const weighed = list.filter(sub => sub.changePercent != null && weightOf(sub) > 0);
                const total = weighed.reduce((sum, sub) => sum + weightOf(sub), 0);
                return total > 0 ? weighed.reduce((sum, sub) => sum + num(sub.changePercent) * weightOf(sub), 0) / total : null;
            }
            const marketMove = averageMove(subsectors, sub => num(sub.marketWeight));
            const yourMove = averageMove(subsectors, sub => num(sub.myValue));

            let mode = stored.get('t212-sectors-mode') === 'mine' ? 'mine' : 'market';
            let onlyMine = stored.get('t212-sectors-only-mine') === 'on';
            let selected = null;   // the name of the subsector open in the column

            // ===== The strip above the map =====
            (function strip() {
                if (!quoted.length) return;
                const sorted = quoted.slice().sort((a, b) => num(a.changePercent) - num(b.changePercent));
                const worst = sorted[0], best = sorted[sorted.length - 1];
                document.getElementById('strip').innerHTML = sorted.map(sub => '<span class="' + (sub.holdings.length ? 'held' : '') + '" style="background:'
                    + colour(num(sub.changePercent)) + '" title="' + escape(sub.name) + ' ' + moveText(num(sub.changePercent)) + '"></span>').join('');
                document.getElementById('strip').setAttribute('aria-label', 'Every subsector from the worst, ' + worst.name + ', to the best, ' + best.name);
                document.getElementById('strip-worst').innerHTML = '<span class="' + moveClass(num(worst.changePercent)) + '">' + moveText(num(worst.changePercent)) + '</span> ' + escape(shortName(worst.name));
                document.getElementById('strip-best').innerHTML = escape(shortName(best.name)) + ' <span class="' + moveClass(num(best.changePercent)) + '">' + moveText(num(best.changePercent)) + '</span>';
                document.getElementById('strip-wrap').hidden = false;
            })();

            // ===== Squarified treemap (Bruls, Huizing and van Wijk): rows of tiles kept as close to squares as possible =====
            function worstRatio(row, side) {
                const sum = row.reduce((total, node) => total + node.area, 0);
                const max = Math.max(...row.map(node => node.area));
                const min = Math.min(...row.map(node => node.area));
                return Math.max(side * side * max / (sum * sum), (sum * sum) / (side * side * min));
            }
            function placeRow(row, rect, out) {
                const sum = row.reduce((total, node) => total + node.area, 0);
                if (rect.w >= rect.h) {
                    // A column on the left, as tall as the space
                    const width = sum / rect.h;
                    let y = rect.y;
                    row.forEach(node => { const height = node.area / width; out.push({ item: node.item, x: rect.x, y, w: width, h: height }); y += height; });
                    return { x: rect.x + width, y: rect.y, w: rect.w - width, h: rect.h };
                }
                // A row on top, as wide as the space
                const height = sum / rect.w;
                let x = rect.x;
                row.forEach(node => { const width = node.area / height; out.push({ item: node.item, x, y: rect.y, w: width, h: height }); x += width; });
                return { x: rect.x, y: rect.y + height, w: rect.w, h: rect.h - height };
            }
            function squarify(items, rect) {
                const total = items.reduce((sum, item) => sum + item.size, 0);
                if (total <= 0 || rect.w <= 0 || rect.h <= 0) return [];
                const scale = rect.w * rect.h / total;
                const nodes = items.slice().sort((a, b) => b.size - a.size).map(item => ({ item, area: item.size * scale }));
                const out = [];
                let row = [];
                let space = rect;
                for (let i = 0; i < nodes.length;) {
                    const side = Math.min(space.w, space.h);
                    if (row.length === 0 || worstRatio(row.concat(nodes[i]), side) <= worstRatio(row, side)) {
                        row.push(nodes[i]);
                        i++;
                    } else {
                        space = placeRow(row, space, out);
                        row = [];
                    }
                }
                if (row.length) placeRow(row, space, out);
                return out;
            }

            // ===== Text that never comes out cut =====
            const tooTall = tile => tile.scrollHeight > tile.clientHeight + 1;
            // The % shrinks until it fits; then one decimal less; then nothing
            function fitMove(tile, moveEl, move, start) {
                const style = getComputedStyle(tile);
                const room = tile.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight);
                for (let size = start; size >= 0.8; size -= 0.1) {
                    moveEl.style.setProperty('--size', size + 'rem');
                    if (moveEl.scrollWidth <= room) return;
                }
                moveEl.textContent = signed(move, 1);
                if (moveEl.scrollWidth > room) moveEl.remove();
            }
            // The name whole, else the short one, else on two lines, else nothing (the % stays)
            function fitName(tile, nameEl, full) {
                for (const text of [full, shortName(full)]) {
                    nameEl.textContent = text;
                    nameEl.classList.remove('wrap');
                    if (nameEl.scrollWidth <= nameEl.clientWidth + 0.5 && !tooTall(tile)) return;
                }
                nameEl.textContent = full;
                nameEl.classList.add('wrap');
                if (nameEl.scrollWidth <= nameEl.clientWidth + 0.5 && !tooTall(tile)) return;
                nameEl.remove();
            }

            // ===== Drawing the map =====
            const sizeOf = sub => mode === 'mine' ? num(sub.myValue) : num(sub.marketWeight);

            function draw() {
                map.textContent = '';
                const width = map.clientWidth;
                const height = map.clientHeight;
                const sectors = data.sectors
                    .map(sector => ({ sector, subs: sector.subsectors.filter(sub => sizeOf(sub) > 0) }))
                    .map(entry => ({ ...entry, size: entry.subs.reduce((sum, sub) => sum + sizeOf(sub), 0) }))
                    .filter(entry => entry.size > 0);

                if (!sectors.length) {
                    map.innerHTML = mode === 'mine'
                        ? '<div class="map-empty"><strong>Nothing to size yet</strong><span>Your positions show up here once Trading 212 has sent them.</span></div>'
                        : '<div class="map-empty"><strong>No sectors</strong></div>';
                    return;
                }

                const rootStyle = getComputedStyle(document.documentElement);
                const rem = parseFloat(rootStyle.fontSize);
                const gap = 6;       // between sectors: wider than between subsectors, so each sector reads as one block
                const tileGap = 2;   // between subsectors: only a gap, no borders or shine

                squarify(sectors, { x: 0, y: 0, w: width, h: height }).forEach(placed => {
                    const { sector, subs } = placed.item;
                    const box = { x: placed.x + gap / 2, y: placed.y + gap / 2, w: placed.w - gap, h: placed.h - gap };
                    const block = document.createElement('div');
                    block.className = 'sector-block';
                    Object.assign(block.style, { left: box.x + 'px', top: box.y + 'px', width: box.w + 'px', height: box.h + 'px' });
                    map.append(block);

                    // The sector's name and move above its tiles: whole, short, on two lines, or not at all
                    let labelHeight = 0;
                    if (box.h >= 48) {
                        const move = num(sector.changePercent);
                        const label = document.createElement('div');
                        label.className = 'sector-label';
                        label.innerHTML = '<span class="name"></span><span class="move ' + moveClass(move) + '">' + moveText(move) + '</span>';
                        block.append(label);
                        const name = label.querySelector('.name');
                        const tooWide = () => label.scrollWidth > label.clientWidth + 1;
                        name.textContent = sector.name;
                        if (tooWide()) name.textContent = shortName(sector.name);
                        if (tooWide() && box.h >= 70) {
                            label.classList.add('two');
                            name.textContent = sector.name;
                            if (tooWide()) name.textContent = shortName(sector.name);
                        }
                        if (tooWide()) label.remove();
                        else labelHeight = label.classList.contains('two') ? 2.4 * rem : 1.4 * rem;
                    }

                    const inner = { x: 0, y: labelHeight, w: box.w, h: box.h - labelHeight };
                    squarify(subs.map(sub => ({ sub, size: sizeOf(sub) })), inner).forEach(cell => {
                        tile(cell.item.sub, block, {
                            x: cell.x + tileGap / 2, y: cell.y + tileGap / 2, w: cell.w - tileGap, h: cell.h - tileGap
                        });
                    });
                });
                map.classList.toggle('only-mine', onlyMine);
            }

            function tile(sub, block, box) {
                const move = num(sub.changePercent);
                const held = sub.holdings.length > 0;
                const button = document.createElement('button');
                button.type = 'button';
                button.className = 'tile';
                button.dataset.name = sub.name;
                Object.assign(button.style, { left: box.x + 'px', top: box.y + 'px', width: Math.max(box.w, 0) + 'px', height: Math.max(box.h, 0) + 'px' });
                if (move != null) button.style.setProperty('--tile-bg', colour(move));
                button.classList.toggle('held', held);
                button.setAttribute('aria-pressed', String(selected === sub.name));
                button.setAttribute('aria-label', sub.name + ', ' + sub.sector + ', ' + (move == null ? 'no price yet' : moveText(move) + ' today')
                    + (held ? ', you hold ' + sub.holdings.length + (sub.holdings.length === 1 ? ' stock' : ' stocks') : ''));
                button.addEventListener('pointerenter', event => showTip(sub, event));
                button.addEventListener('pointermove', event => placeTip(event.clientX, event.clientY));
                button.addEventListener('pointerleave', hideTip);
                button.addEventListener('focus', () => { const r = button.getBoundingClientRect(); showTip(sub); placeTip(r.left + r.width / 2, r.bottom); });
                button.addEventListener('blur', hideTip);
                button.addEventListener('click', () => select(selected === sub.name ? null : sub.name));
                block.append(button);   // in the page first: the text below is measured

                // Tall and narrow: short name and % turned on their side
                if (box.h >= 2.4 * box.w && box.w >= 18 && box.w < 70 && box.h >= 60) {
                    button.classList.add('vertical');
                    button.innerHTML = '<span class="tile-name">' + escape(shortName(sub.name)) + '</span><span class="tile-move">' + (move == null ? '—' : signed(move, 1)) + '</span>';
                    const overflows = () => button.scrollHeight > button.clientHeight + 1 || button.scrollWidth > button.clientWidth + 1;
                    if (overflows()) button.querySelector('.tile-name').remove();
                    if (overflows()) button.textContent = '';
                    return;
                }
                if (box.w < 34 || box.h < 20) return;   // too small for text: the colour and the tooltip say it

                // One line high: only the %
                if (box.h < 42) {
                    button.classList.add('compact');
                    button.innerHTML = '<span class="tile-move"></span>';
                    button.firstChild.textContent = moveText(move);
                    fitMove(button, button.firstChild, move ?? 0, 0.9);
                    return;
                }

                button.innerHTML = '<span class="tile-name"></span><span class="tile-move"></span>';
                const nameEl = button.querySelector('.tile-name');
                const moveEl = button.querySelector('.tile-move');
                moveEl.textContent = moveText(move);
                const start = Math.max(0.95, Math.min(1.9, Math.sqrt(box.w * box.h) / 85));   // the % grows a little with the tile
                fitMove(button, moveEl, move ?? 0, start);
                fitName(button, nameEl, sub.name);
                // Still taller than the tile: the % gets smaller; if that is not enough, only the % stays
                for (let size = parseFloat(moveEl.style.getPropertyValue('--size')) || start; tooTall(button) && size > 0.8; size -= 0.1) {
                    moveEl.style.setProperty('--size', size + 'rem');
                }
                if (tooTall(button) && nameEl.isConnected) nameEl.remove();

                if (box.w >= 150 && box.h >= 92) {
                    if (sub.etf) button.insertAdjacentHTML('beforeend', '<span class="tile-etf">' + escape(sub.etf) + '</span>');
                    if (held) {
                        const shown = sub.holdings.slice(0, 3).map(h => '<span class="tile-chip">' + escape(h.symbol) + '</span>').join('');
                        const more = sub.holdings.length > 3 ? '<span class="tile-chip">+' + (sub.holdings.length - 3) + '</span>' : '';
                        button.insertAdjacentHTML('beforeend', '<span class="tile-chips">' + shown + more + '</span>');
                    }
                }
            }

            // ===== Tooltip =====
            function showTip(sub, event) {
                const move = num(sub.changePercent);
                const mine = num(sub.myValue) > 0
                    ? percent(sub.myWeight) + ' (' + sub.holdings.length + (sub.holdings.length === 1 ? ' stock)' : ' stocks)')
                    : 'Nothing held';
                tip.innerHTML = '<div class="tip-name">' + escape(sub.name) + '</div>'
                    + '<div class="tip-where">' + escape(sub.sector) + (sub.etf ? ', followed through ' + escape(sub.etf) : '') + '</div>'
                    + '<div class="tip-line"><span>Today</span><span class="' + moveClass(move) + '">' + moveText(move) + '</span></div>'
                    + '<div class="tip-line"><span>Your portfolio</span><span>' + mine + '</span></div>';
                tip.hidden = false;
                if (event) placeTip(event.clientX, event.clientY);
            }
            function placeTip(x, y) {
                const margin = 14;
                const box = tip.getBoundingClientRect();
                const left = x + margin + box.width > innerWidth ? x - margin - box.width : x + margin;
                const top = y + margin + box.height > innerHeight ? y - margin - box.height : y + margin;
                tip.style.left = Math.max(4, left) + 'px';
                tip.style.top = Math.max(4, top) + 'px';
            }
            function hideTip() { tip.hidden = true; }

            // ===== The column =====
            function renderPulse() {
                const sub = selected && subsectors.find(s => s.name === selected);
                pulse.innerHTML = sub ? detail(sub) : overview();
                const back = pulse.querySelector('.back');
                if (back) back.addEventListener('click', () => select(null));
                pulse.querySelectorAll('[data-open]').forEach(button => button.addEventListener('click', () => select(button.dataset.open)));
            }

            // You and the market: the two figures, and both as marks on one line from losing to gaining
            function versus() {
                if (marketMove == null) return '<p class="pulse-empty">The comparison with the market shows up with the first prices.</p>';
                const range = Math.max(MAX_MOVE, Math.ceil(Math.max(Math.abs(marketMove), Math.abs(yourMove ?? 0))));
                const at = value => (50 + value / range * 50).toFixed(2) + '%';
                let html = '<div class="versus-figures">';
                if (yourMove != null) {
                    html += '<div><small><span class="mark-you"></span>Your sectors</small><b class="' + moveClass(yourMove) + '">' + moveText(yourMove) + '</b></div>';
                }
                html += '<div class="market"><small><span class="mark-market"></span>The market</small><b>' + moveText(marketMove) + '</b></div></div>'
                    + '<div class="versus-line" role="img" aria-label="' + (yourMove == null ? '' : 'Your sectors ' + moveText(yourMove) + ', ') + 'the market ' + moveText(marketMove) + '">'
                    + '<span class="zero"></span><span class="mark-market" style="left:' + at(marketMove) + '"></span>'
                    + (yourMove == null ? '' : '<span class="mark-you" style="left:' + at(yourMove) + '"></span>') + '</div>'
                    + '<div class="versus-scale"><span>−' + range + ' %</span><span>0</span><span>+' + range + ' %</span></div>';
                const ups = quoted.filter(sub => num(sub.changePercent) > 0).length;
                const breadth = ups + ' of ' + quoted.length + ' subsectors are up.';
                if (yourMove == null) return html + '<p class="versus-note">' + breadth + '</p>';
                const difference = yourMove - marketMove;
                const lead = Math.abs(difference) < 0.005 ? 'Your sectors move with the market. '
                    : (difference > 0 ? 'Your sectors beat the market by ' : 'Your sectors trail the market by ') + Math.abs(difference).toFixed(2) + ' points. ';
                return html + '<p class="versus-note">' + lead + breadth + '</p>';
            }

            function overview() {
                let html = '<h2 class="card-title" id="pulse-title">Sector pulse</h2>' + versus();

                html += '<h3>Where you hold stocks, today</h3>';
                const held = subsectors
                    .filter(sub => sub.holdings.length > 0)
                    .sort((a, b) => (num(b.changePercent) ?? -Infinity) - (num(a.changePercent) ?? -Infinity));
                if (!held.length) {
                    html += '<p class="pulse-empty">Your subsectors show up here once your positions have arrived.</p>';
                } else {
                    html += '<ul class="bars">' + held.map(sub => {
                        const move = num(sub.changePercent);
                        const width = move == null ? 0 : Math.min(Math.abs(move), MAX_MOVE) / MAX_MOVE * 50;
                        const place = move != null && move < 0 ? 'right:50%' : 'left:50%';
                        return '<li><button type="button" data-open="' + escape(sub.name) + '" title="' + escape(sub.name) + ': ' + percent(sub.myWeight) + ' of your portfolio">'
                            + '<span class="name">' + escape(sub.name) + '</span>'
                            + '<span class="track"><span class="fill ' + moveClass(move) + '" style="' + place + ';width:' + width + '%"></span></span>'
                            + '<span class="value ' + moveClass(move) + '">' + moveText(move) + '</span></button></li>';
                    }).join('') + '</ul>';
                }

                html += '<h3>Where your money is</h3>';
                const yours = data.sectors
                    .filter(sector => num(sector.myValue) > 0)
                    .map(sector => ({ sector, move: averageMove(sector.subsectors, sub => num(sub.myValue)) }))
                    .sort((a, b) => num(b.sector.myValue) - num(a.sector.myValue));
                if (!yours.length) {
                    html += '<p class="pulse-empty">Your sectors show up here once your positions have arrived.</p>';
                } else {
                    const share = value => num(data.invested) > 0 ? num(value) * 100 / num(data.invested) : 0;
                    html += '<div class="weight-bar" role="img" aria-label="Your money by sector">'
                        + yours.map((entry, i) => '<span style="--swatch: var(--cat-' + (i % 10 + 1) + '); flex: ' + num(entry.sector.myValue) + '" title="'
                            + escape(entry.sector.name) + ': ' + percent(share(entry.sector.myValue)) + '"></span>').join('')
                        + '</div><ul class="weight-list">'
                        + yours.slice(0, 5).map((entry, i) => '<li style="--swatch: var(--cat-' + (i + 1) + ')"><span class="swatch"></span><span>'
                            + escape(entry.sector.name) + '</span><span class="figure">' + percent(share(entry.sector.myValue)) + '</span>'
                            + '<span class="day ' + moveClass(entry.move) + '">' + moveText(entry.move) + '</span></li>').join('')
                        + '</ul>'
                        + (yours.length > 5 ? '<p class="weight-more">and ' + (yours.length - 5) + ' more ' + (yours.length - 5 === 1 ? 'sector' : 'sectors') + '</p>' : '');
                }
                return html + '<p class="pulse-note">Pick a tile to see your stocks in it.</p>';
            }

            function detail(sub) {
                const move = num(sub.changePercent);
                const todayChange = num(sub.myTodayChange);
                let html = '<button type="button" class="back"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>All sectors</button>'
                    + '<h2 class="card-title detail-title" id="pulse-title">' + escape(sub.name) + '</h2>'
                    + '<p class="detail-where">' + escape(sub.sector) + (sub.etf ? ', followed through ' + escape(sub.etf) : '') + '</p>'
                    + '<p class="detail-move ' + moveClass(move) + '">' + moveText(move) + '<small>today</small></p>';

                if (!sub.holdings.length) {
                    return html + '<h3>Your stocks</h3><p class="pulse-empty">You hold nothing in ' + escape(sub.name) + '.</p>';
                }

                html += '<dl class="detail-exposure">'
                    + '<div><dt>You have here</dt><dd>' + money(num(sub.myValue)) + '</dd></div>'
                    + '<div><dt>Of your portfolio</dt><dd>' + percent(sub.myWeight) + '</dd></div>'
                    + '<div><dt>Today</dt><dd class="' + moveClass(todayChange) + '">' + signedMoney(todayChange) + '</dd></div>'
                    + '</dl>';

                html += '<h3>Your stocks</h3><ul class="stocks">' + sub.holdings.map(h => {
                    const stockMove = num(h.changePercent);
                    const isUs = h.ticker.includes('_US_');
                    return '<li><a href="/?filter=' + encodeURIComponent(h.symbol) + '" title="Show ' + escape(h.symbol) + ' in your portfolio">'
                        + '<span class="logo" aria-hidden="true"><span class="logo-initial">' + escape((h.symbol || '?').charAt(0)) + '</span>'
                        + (isUs ? '<img src="/logos/' + encodeURIComponent(h.ticker) + '" alt="" loading="lazy" onerror="this.remove()">' : '') + '</span>'
                        + '<span class="symbol">' + escape(h.symbol) + '</span>'
                        + '<span class="figures-right">' + money(num(h.value)) + '<small><span class="' + moveClass(stockMove) + '">' + moveText(stockMove) + '</span>, '
                        + percent(h.weight) + '</small></span>'
                        + '<span class="name">' + escape(h.name) + '</span>'
                        + '</a></li>';
                }).join('') + '</ul><p class="pulse-note">Pick one to see it in your portfolio.</p>';
                return html;
            }

            function select(name) {
                selected = name;
                map.querySelectorAll('.tile').forEach(t => t.setAttribute('aria-pressed', String(t.dataset.name === name)));
                renderPulse();
            }

            // ===== Controls =====
            function showMode() {
                modeButtons.forEach(button => button.setAttribute('aria-pressed', String(button.dataset.mode === mode)));
                onlyMineButton.setAttribute('aria-pressed', String(onlyMine));
            }
            modeButtons.forEach(button => button.addEventListener('click', () => {
                mode = button.dataset.mode;
                stored.set('t212-sectors-mode', mode);
                showMode();
                draw();
            }));
            onlyMineButton.addEventListener('click', () => {
                onlyMine = !onlyMine;
                stored.set('t212-sectors-only-mine', onlyMine ? 'on' : 'off');
                showMode();
                map.classList.toggle('only-mine', onlyMine);
            });
            document.addEventListener('keydown', event => { if (event.key === 'Escape' && selected) select(null); });

            showMode();
            renderPulse();
            draw();
            // The tiles depend on the map's size: drawn again whenever it changes (window, column, phone turned)
            new ResizeObserver(() => { hideTip(); draw(); }).observe(map);
        })();
    </script>
</body>
</html>
