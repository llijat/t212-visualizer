# Demo mode: invented data, no keys and its own database.
# The position refresh deletes whatever it does not receive, so this must NEVER point at the real database.
# Port 5433 is deliberate: if that database does not exist, the app does not start.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/t212_demo
    username: demo
    password: demo

# The made-up Alpha Vantage has no limits: no need to wait 13 seconds between stocks
alpha-vantage:
  request-delay-ms: 0
finnhub:
  request-delay-ms: 0
