server:
  port: 8080

spring:
  profiles:
    active: local
  task:
    scheduling:
      pool:
        size: 4
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
  datasource:
    url: jdbc:postgresql://localhost:5432/t212_viewdb
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:

      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

t212:
  base-url: https://live.trading212.com/api/v0
  api-key: ${T212_API_KEY:}
  api-secret: ${T212_API_SECRET:}
  sync:
    page-delay-ms: 3500
    retry-delay-ms: 15000

finnhub:
  base-url: https://finnhub.io/api/v1
  api-key: ${FINNHUB_API_KEY:}
