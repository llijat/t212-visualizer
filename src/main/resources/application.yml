server:
  port: 8080
  # The session (used to carry a message across a redirect) travels only in a cookie, never as ;jsessionid=... in the URL,
  # where it would end up in the browser history
  servlet:
    session:
      tracking-modes: cookie

app:
  zone: Europe/Madrid

spring:
  profiles:
    active: local
  task:
    scheduling:
      pool:
        size: 4
  # Static files (CSS) get a fingerprint of their content in their name, for example common-3f9a2c.css.
  # A changed file gets a new name, so browsers can keep each version for a year without ever showing a stale one.
  web:
    resources:
      chain:
        strategy:
          content:
            enabled: true
            paths: /**
      cache:
        cachecontrol:
          max-age: 365d
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
  datasource:
    url: jdbc:postgresql://localhost:5432/t212_viewdb
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:

      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

t212:
  base-url: https://live.trading212.com/api/v0
  api-key: ${T212_API_KEY:}
  api-secret: ${T212_API_SECRET:}
  sync:
    page-delay-ms: 3500
    retry-delay-ms: 15000
  export:
    poll-delay-ms: 65000

finnhub:
  base-url: https://finnhub.io/api/v1
  api-key: ${FINNHUB_API_KEY:}
  # The free plan allows 60 requests a minute: one second between quotes keeps the 15-minute refresh under it
  request-delay-ms: 1000

# Announced dividends and past closing prices. The free plan allows 25 requests a day and 5 a minute, 13 seconds apart.
# The closes go first (backfill-per-day), but only for stocks without a month of them: once filled, they cost nothing.
# The dividends get the rest (stocks-per-day), the stocks checked longest ago first.
alpha-vantage:
  base-url: https://www.alphavantage.co
  api-key: ${ALPHA_VANTAGE_API_KEY:}
  backfill-per-day: 15
  stocks-per-day: 10
  request-delay-ms: 13000
